name: lint
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./nokturno_stremio

  build:
    # sestaví obraz jako Supervisor (amd64) a ověří, že doplněk naběhne s /data/options.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nokturno-ha ./nokturno_stremio
      - name: Spuštění jako v Home Assistantu
        run: |
          mkdir -p data
          echo '{"port":7140,"https_port":7141,"enable_https":false,"tmdb_key":"","stats":false,"crash_reports":false,"update_url":""}' > data/options.json
          docker run -d --name n --network host -v "$PWD/data:/data" nokturno-ha
          for i in $(seq 30); do curl -fs http://127.0.0.1:7140/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:7140/health
          curl -fsS http://127.0.0.1:7140/manifest.json | python3 -c 'import json,sys; m=json.load(sys.stdin); print(m["id"], m["version"])'
          docker exec n cat /app/version.txt
          docker logs n
